name: Tests and lintr
on:
  # Run on pushes to 'main' branch
  push:
    branches:
      - main
      - development
  # Run on any opened pull request
  pull_request:
  # Run manually via GitHub Actions website
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests and lintr
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # load OS (unbuntu) from cache
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          # load the apt-cache directory assigned in the step above
          path: /var/cache/apt/archives
          # current configuration will create a new cache every time test.yml changes.
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          save-always: true

      - name: Setup system dependencies
        # terra requires gdal and sql libraries
        run: |
          packages=(
            libgdal-dev
            libgeos-dev
            libproj-dev
            libsqlite3-dev
          )
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      # load R from cache, or simply restore for small changes to renv.lock.
      - name: Cache R
        uses: actions/cache@v4
        with:
          path: /opt/R
          key: R-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          save-always: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      # load renv from cache, or simply restore for small changes to renv.lock.
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv/cache
          # any change to renv.lock will replace the cache
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-
          save-always: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Lint R
        if: always()
        shell: Rscript {0}
        run: rhino::lint_r()

      - name: Lint JavaScript
        if: always()
        shell: Rscript {0}
        run: rhino::lint_js()

      - name: Lint Sass
        if: always()
        shell: Rscript {0}
        run: rhino::lint_sass()

      - name: Build JavaScript
        if: always()
        shell: Rscript {0}
        run: rhino::build_js()

      - name: Build Sass
        if: always()
        shell: Rscript {0}
        run: rhino::build_sass()

      - name: Run R unit tests
        if: always()
        shell: Rscript {0}
        run: rhino::test_r()

      - name: Run Cypress end-to-end tests
        if: github.ref_name == 'main'
        uses: cypress-io/github-action@v6
        with:
          working-directory: .rhino # Created by earlier commands which use Node.js
          start: npm run run-app
          project: ../tests
          wait-on: 'http://localhost:3333/'
          wait-on-timeout: 60
